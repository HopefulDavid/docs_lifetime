# Sdílená konfigurace generátoru changelogu pro oba dokumentační projekty.

[changelog]
header = """
# Změny

> Tento soubor se automaticky generuje z úplné Git historie. Neupravujte jej ručně.
"""
body = """
> Zdrojový stav: [`{{ commit_id | truncate(length=7, end="") }}`](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit_id }}). Zahrnuté commity: **{{ statistics.commit_count }}**.

---
{% for group, commits in commits | group_by(attribute="group") %}\
{% set title = group | striptags | trim %}\
{% if title == "✨ Nové funkce" %}\
<a id="nove-funkce"></a>
{% elif title == "🐛 Opravy" %}\
<a id="opravy"></a>
{% elif title == "⚡ Výkon" %}\
<a id="vykon"></a>
{% elif title == "📚 Dokumentace" %}\
<a id="dokumentace"></a>
{% elif title == "⏪ Vrácené změny" %}\
<a id="vracene-zmeny"></a>
{% elif title == "🧾 Ostatní změny" %}\
<a id="ostatni-zmeny"></a>
{% elif title == "🔩 Technické změny" %}\
<a id="technicke-zmeny"></a>
{% endif %}\
## {{ title }}

{% if title == "🔩 Technické změny" %}\
<details>
<summary>Zobrazit technické záznamy ({{ commits | length }})</summary>

{% endif %}\
{% for commit in commits %}\
- {% if commit.breaking %}⚠️ **Nekompatibilní změna:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} · {{ commit.author.timestamp | date(format="%Y-%m-%d", timezone="Europe/Prague") }} · [`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }})
{% endfor %}
{% if title == "🔩 Technické změny" %}\
</details>

{% endif %}\
{% endfor %}
"""
trim = true
render_always = true
footer = """
<!-- Vygenerováno pomocí git-cliff; zdrojem pravdy je Git historie a cliff.toml. -->
"""

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
commit_parsers = [
  { message = "(?i)^chore(?:\\([^)]*\\))?: (?:update changelog|release)", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 0 -->✨ Nové funkce" },
  { message = "^fix", group = "<!-- 1 -->🐛 Opravy" },
  { message = "^perf", group = "<!-- 2 -->⚡ Výkon" },
  { message = "^docs?", group = "<!-- 3 -->📚 Dokumentace" },
  { message = "^revert", group = "<!-- 4 -->⏪ Vrácené změny" },
  { message = "^(?:refactor|build|ci|test|style|chore)", group = "<!-- 9 -->🔩 Technické změny" },
  { message = ".*", group = "<!-- 5 -->🧾 Ostatní změny" },
]
protect_breaking_commits = true
filter_commits = false
fail_on_unmatched_commit = false
tag_pattern = "^$"
topo_order = false
topo_order_commits = false
sort_commits = "newest"

[remote]
offline = true

[remote.github]
owner = "HopefulDavid"
repo = "Docs_Lifetime"
