# Konfigurace veřejného changelogu tohoto projektu.

[changelog]
header = """
# Změny

<!-- Zdroj: Git historie a cliff.toml. Obnova: npm run docs:generate. -->

<div class="change-hero">
<div class="change-hero-icons" aria-hidden="true"><span class="change-hero-icon"><span class="ui-icon ui-icon--book"></span></span></div>
<div><p class="change-eyebrow">Každodenní život</p><p class="change-lead">Co je nového v návodech, receptech a na webu</p></div>
</div>

<details class="change-about">
<summary>O tomto přehledu</summary>

Přehled se automaticky vytváří z úplné historie projektu.

Starší roky jsou sbalené a roky bez změn se nezobrazují.

Technické záznamy zůstávají součástí historie.

"""
body = """
Zdrojový stav: `{{ commit_id | truncate(length=7, end="") }}` · Celkem {{ statistics.commit_count }} změn.

</details>

{% if commits | length == 0 %}\
> V dostupné historii nejsou žádné změny.
{% else %}\
{% set newest_commit = commits | first %}\
{% set latest_period = newest_commit.author.timestamp | date(format="%Y", timezone="Europe/Prague") %}\
{% set_global rendered_period = "" %}\
{% for commit in commits %}\
{% set period = commit.author.timestamp | date(format="%Y", timezone="Europe/Prague") %}\
{% if period != rendered_period %}\
{% if rendered_period != "" and rendered_period != latest_period %}\
</details>

{% endif %}\
{% set_global rendered_period = period %}\
{% set_global period_count = 0 %}\
{% for period_commit in commits %}\
{% set period_commit_year = period_commit.author.timestamp | date(format="%Y", timezone="Europe/Prague") %}\
{% if period_commit_year == period %}\
{% set_global period_count = period_count + 1 %}\
{% endif %}\
{% endfor %}\
<a id="obdobi-{{ period }}"></a>
{% if period == latest_period %}\
## Nejnovější změny · {{ period }} <small>(počet změn: {{ period_count }})</small>

{% else %}\
<details class="change-year">
<summary><strong>Rok {{ period }}</strong> · počet změn: {{ period_count }}</summary>

{% endif %}\
{% endif %}\
{% set title = commit.group | striptags | trim %}\
{% if title == "✨ Nové funkce" %}\
{% set kind = "Novinka" %}\
{% set icon = "leaf" %}\
{% set slug = "nove-funkce" %}\
{% elif title == "🐛 Opravy" %}\
{% set kind = "Oprava" %}\
{% set icon = "check-circle" %}\
{% set slug = "opravy" %}\
{% elif title == "⚡ Výkon" %}\
{% set kind = "Zrychlení" %}\
{% set icon = "clock" %}\
{% set slug = "vykon" %}\
{% elif title == "📚 Dokumentace" %}\
{% set kind = "Dokumentace" %}\
{% set icon = "book" %}\
{% set slug = "dokumentace" %}\
{% elif title == "⏪ Vrácené změny" %}\
{% set kind = "Vrácená změna" %}\
{% set icon = "reset" %}\
{% set slug = "vracene-zmeny" %}\
{% elif title == "🔩 Technické změny" %}\
{% set kind = "Zákulisí webu" %}\
{% set icon = "kitchen" %}\
{% set slug = "technicke-zmeny" %}\
{% else %}\
{% set kind = "Další změna" %}\
{% set icon = "info" %}\
{% set slug = "ostatni-zmeny" %}\
{% endif %}\
- <!-- category:{{ slug }}:{{ period }} --><span class="change-kind change-kind--{{ slug }}"><span class="ui-icon ui-icon--{{ icon }}" aria-hidden="true"></span>{{ kind }}</span> <small class="change-meta">{{ commit.author.timestamp | date(format="%d. %m. %Y", timezone="Europe/Prague") }}{% if commit.scope %} · {{ commit.scope }}{% endif %} · {{ commit.id | truncate(length=7, end="") }}</small> {% if commit.breaking %}<span class="change-breaking">Důležitá nekompatibilní změna</span> {% endif %}**{{ commit.message | upper_first }}**<!-- article:{{ commit.id }} -->
{% endfor %}\
{% if rendered_period != latest_period %}\
</details>
{% endif %}\
{% endif %}"""
trim = true
render_always = true
footer = """
<!-- Vygenerováno pomocí git-cliff; zdrojem pravdy je Git historie a cliff.toml. -->
"""

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
commit_parsers = [
  { message = "(?i)^chore(?:\\([^)]*\\))?: (?:update changelog|release)", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 0 -->✨ Nové funkce" },
  { message = "^fix", group = "<!-- 1 -->🐛 Opravy" },
  { message = "^perf", group = "<!-- 2 -->⚡ Výkon" },
  { message = "^docs?", group = "<!-- 3 -->📚 Dokumentace" },
  { message = "^revert", group = "<!-- 4 -->⏪ Vrácené změny" },
  { message = "^(?:refactor|build|ci|test|style|chore)", group = "<!-- 9 -->🔩 Technické změny" },
  { message = ".*", group = "<!-- 5 -->🧾 Ostatní změny" },
]
protect_breaking_commits = true
filter_commits = false
fail_on_unmatched_commit = false
tag_pattern = "^$"
topo_order = false
topo_order_commits = false
sort_commits = "newest"

[remote]
offline = true
